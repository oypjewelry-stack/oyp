<script>
const ROI = { x: 0.578, y: 0.150, w: 0.377, h: 0.815 };
function paper(W, H) {
  const rgba = new Uint8ClampedArray(W * H * 4);
  for (let i = 0; i < rgba.length; i += 4) {
    rgba[i] = 248; rgba[i + 1] = 246; rgba[i + 2] = 240; rgba[i + 3] = 255;
  }

}
function setPx(rgba, W, x, y, r, g, b) {

  if (x < 0 || y < 0 || x >= W) return;
  const o = (y * W + x) * 4;
  if (o < 0 || o + 3 >= rgba.length) return;

function strokeEllipse(rgba, W, cx, cy, rx, ry, thick, col) {
  for (let y = Math.floor(cy - ry - thick); y <= cy + ry + thick; y++) {
    for (let x = Math.floor(cx - rx - thick); x <= cx + rx + thick; x++) {
      const nx = (x - cx) / rx, ny = (y - cy) / ry;
      const d = Math.sqrt(nx * nx + ny * ny);
      if (Math.abs(d - 1) <= thick / Math.min(rx, ry)) setPx(rgba, W, x, y, col[0], col[1], col[2]);
    }
  }
}
function fillEllipse(rgba, W, cx, cy, rx, ry, col) {
  for (let y = Math.floor(cy - ry); y <= cy + ry; y++) {
    for (let x = Math.floor(cx - rx); x <= cx + rx; x++) {
      const nx = (x - cx) / rx, ny = (y - cy) / ry;

}
function line(rgba, W, x0, y0, x1, y1, thick, col) {

  for (let i = 0; i <= steps; i++) {

    for (let dy = -thick; dy <= thick; dy++) for (let dx = -thick; dx <= thick; dx++) {

}
function roiOf(W, H) {
  return { x: Math.round(W * ROI.x), y: Math.round(H * ROI.y), w: Math.round(W * ROI.w), h: Math.round(H * ROI.h) };
}
function toUrl(rgba, W, H) {

}
function tallPage() {
  const W = 1100, H = 1700, rgba = paper(W, H), R = roiOf(W, H);
  const cx = R.x + Math.round(R.w * 0.5);
  const top = R.y + 160, bot = R.y + R.h - 180;
  const ink = [28, 28, 32], gem = [70, 150, 200];
  strokeEllipse(rgba, W, cx, top + 40, 46, 70, 7, ink);
  fillEllipse(rgba, W, cx, top + 28, 22, 28, gem);
  line(rgba, W, cx, top + 110, cx, bot - 40, 4, ink);
  strokeEllipse(rgba, W, cx, bot - 10, 70, 90, 8, ink);
  fillEllipse(rgba, W, cx, bot - 20, 26, 34, gem);
  line(rgba, W, 80, 400, 420, 430, 2, ink);
  return toUrl(rgba, W, H);
}
function widePage() {
  const W = 1800, H = 1100, rgba = paper(W, H), R = roiOf(W, H);
  const cy = R.y + Math.round(R.h * 0.48);
  const x0 = R.x + 70, x1 = R.x + R.w - 70;
  const ink = [28, 28, 32], gem = [70, 150, 200];
  line(rgba, W, x0, cy - 36, x1, cy - 36, 5, ink);
  line(rgba, W, x0, cy + 36, x1, cy + 36, 5, ink);
  line(rgba, W, x0, cy - 36, x0, cy + 36, 5, ink);
  line(rgba, W, x1, cy - 36, x1, cy + 36, 5, ink);
  for (let i = 0; i < 5; i++) {
    const x = x0 + (x1 - x0) * (i + 0.5) / 5;
    fillEllipse(rgba, W, x, cy, 18, 24, gem);
    strokeEllipse(rgba, W, x, cy, 18, 24, 3, ink);
  }
  line(rgba, W, 60, 200, 500, 240, 2, ink);
  return toUrl(rgba, W, H);
}
function squarePage() {
  const W = 1400, H = 1200, rgba = paper(W, H), R = roiOf(W, H);
  const cx = R.x + R.w / 2, cy = R.y + R.h / 2;
  const ink = [28, 28, 32], gem = [70, 150, 200];
  strokeEllipse(rgba, W, cx, cy, 150, 150, 8, ink);
  fillEllipse(rgba, W, cx, cy - 20, 36, 36, gem);

}
function whitePage() {
  const W = 1200, H = 800, rgba = paper(W, H), R = roiOf(W, H);

}
function realPhoto() {
  const c = document.createElement('canvas');

  g.fillStyle = '#cfc8bc';
  g.fillRect(0, 0, 900, 675);
  g.strokeStyle = '#b8860b';
  g.lineWidth = 46;
  g.beginPath();
  g.ellipse(450, 330, 150, 170, 0, 0, Math.PI * 2);
  g.stroke();
  g.strokeStyle = '#f3e2a4';
  g.lineWidth = 10;

function box(el) {

}

}
window.__measure = function () {
  const frame = document.querySelector('#ivSheet .ivph.big');

  const ib = img ? box(img) : null, pb = pen ? box(pen) : null, zb = face ? box(face) : null, sb = svg ? box(svg) : null, ob = orig ? box(orig) : null, fb = frame ? box(frame) : null;
  const pad = cs ? parseFloat(cs.paddingBottom) || 0 : 0;
