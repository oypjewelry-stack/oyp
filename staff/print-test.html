<!doctype html>
<html lang="en" data-oyp-scanner="0"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow"><title>OYP Jewelry · Print test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../design.js?v=6"></script>
<link rel="stylesheet" href="../app.css?v=48">
<link rel="stylesheet" href="../settings.css?v=11">
<link rel="stylesheet" href="../print.css?v=15">
<link rel="icon" type="image/png" href="../favicon.png"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
</head><body>
<header class="top">
  <button id="btnMenu" class="icon" aria-label="Menu"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button>
  <span id="title" class="title">Print test</span>
  <span class="topend"><img class="logo" src="../logo.png" alt="OYP Jewelry"></span>
</header>
<div id="menu" class="menu hidden"></div>
<section class="office" id="vOffice">
<nav id="side" class="side"></nav>
<main class="main set pr-page">
  <section class="pr-sec">
    <h2>Print queue</h2>
    <div class="setbox" id="printQueue"></div>
    <div class="setbox" id="printRange"></div>
  </section>
  <section class="pr-sec">
    <h2>Settings</h2>
    <div id="printSet"></div>
  </section>
  <section class="pr-sec">
    <h2>Label alignment</h2>
    <div class="pr-copy">
      <p class="muted">Chrome or Edge on Windows, Mac, and Android. USB serial is the fallback on a computer. iPhone and iPad Safari cannot connect. The sticker is the JO number. The name stays on the queue list only.</p>
      <p id="prSum" class="muted"></p>
      <p id="prOff" class="muted"></p>
    </div>
    <div class="pr-previews" id="prViews"></div>
  </section>
</main>
</section>
<div id="toast" class="toast hidden"></div>
<script src="../vendor/qrcode.js?v=1"></script>
<script src="../vendor/niimbluelib-0.47.1.js?v=1"></script>
<script src="../print-label.js?v=10"></script>
<script src="../print.js?v=21"></script>
<script src="../nav.js?v=47"></script>
<script>
(function () {
  var menu = document.getElementById('menu');
  var side = document.getElementById('side');
  if (side) side.innerHTML = OYPNav.sideHtml(OYPNav.readUser(), '', 'index.html');
  document.getElementById('btnMenu').addEventListener('click', function (e) {
    e.stopPropagation();
    if (!menu.classList.contains('hidden')) { menu.classList.add('hidden'); return; }
    menu.innerHTML = OYPNav.menuHtml(OYPNav.readUser(), '', 'index.html');
    menu.classList.remove('hidden');
  });
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-logout]')) {
      try { localStorage.removeItem('oypSession'); localStorage.removeItem('oypUser'); localStorage.removeItem('oypSessionExp'); } catch (err) {}
      location.href = 'index.html';
      return;
    }
    var who = document.getElementById('whoMenu'), whoBtn = document.getElementById('whoBtn');
    if (who && whoBtn && e.target.closest('#whoBtn')) {
      var open = who.classList.contains('hidden');
      who.classList.toggle('hidden', !open);
      whoBtn.classList.toggle('open', open);
      whoBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    } else if (who && whoBtn && !e.target.closest('#whoMenu')) {
      who.classList.add('hidden');
      whoBtn.classList.remove('open');
      whoBtn.setAttribute('aria-expanded', 'false');
    }
    if (!e.target.closest('#menu,#btnMenu')) menu.classList.add('hidden');
  });
  function draw() {
  var columns = [
    [
      { title: 'B31 Printer for 30x20 - Test', kind: 'jo_card', model: 'B31', jo: '26-287', due: '2026-10-21', client: 'Elena Tan' },
      { title: 'B31 calibration', kind: 'cal_jo', model: 'B31' }
    ],
    [
      { title: 'B1 Printer for 30x20 - Test', kind: 'jo_card', model: 'B1', jo: '26-287', due: '2026-10-21', client: 'Elena Tan' },
      { title: 'B1 Printer for Jewelry Tag - Test', kind: 'jewelry_tag', model: 'B1', jo: '26-287', client: 'Elena Tan', karat: '18k', metal: 'gold', stone: 'diamond', size: '6', weight: '4.2' },
      { title: 'B1 calibration', kind: 'cal_tag', model: 'B1' }
    ]
  ];
  var host = document.getElementById('prViews');
  columns.forEach(function (samples) {
    var col = document.createElement('div');
    col.className = 'pr-col';
    samples.forEach(function (s) {
    var card = document.createElement('div');
    card.className = 'dcard';
    var sh = OYPPrint.shiftPx(s.model || 'B31');
    var rendered = OYPLabel.render(Object.assign({}, s, { shiftX: sh.x, shiftY: sh.y }));
    var view = OYPLabel.preview(rendered, { scale: 4, smooth: true });
    var canvas = view.canvas;
    canvas.className = 'pr-sticker';
    canvas.setAttribute('aria-label', s.title);
    var title = document.createElement('div');
    title.className = 'dtitle';
    var h = document.createElement('b');
    h.textContent = s.title;
    title.appendChild(h);
    card.appendChild(title);
    var stage = document.createElement('div');
    stage.className = 'pr-stage';
    stage.appendChild(canvas);
    card.appendChild(stage);
    var p = document.createElement('p');
    p.className = 'muted';
    var off = OYPPrint.offsetMm(s.model || 'B31');
    p.textContent = (rendered.lines.length ? rendered.lines.join(' · ') : 'Border and centre mark') + ' · ' + (s.model || 'B31') + ' offset ' + off.x.toFixed(1) + ' mm horizontal, ' + off.y.toFixed(1) + ' mm vertical';
    card.appendChild(p);
    var row = document.createElement('div');
    row.className = 'fbtns oyp-pr-acts';
    var png = document.createElement('button');
    png.type = 'button';
    png.className = 'pill sm outline';
    png.textContent = 'Download';
    png.onclick = function () { OYPPrint.download(s.kind, s); };
    row.appendChild(png);
    var go = document.createElement('button');
    go.type = 'button';
    go.className = 'pill sm';
    go.textContent = 'PRINT';
    go.onclick = function () { OYPPrint.printLocal(s); };
    row.appendChild(go);
    card.appendChild(row);
    col.appendChild(card);
    });
    host.appendChild(col);
  });
  document.getElementById('prSum').textContent = OYPPrint.summary();
  var b31 = OYPPrint.offsetMm('B31'), b1 = OYPPrint.offsetMm('B1');
  document.getElementById('prOff').textContent = 'Saved offset. B31 ' + b31.x.toFixed(1) + ' mm horizontal, ' + b31.y.toFixed(1) + ' mm vertical. B1 ' + b1.x.toFixed(1) + ' mm horizontal, ' + b1.y.toFixed(1) + ' mm vertical. The border and centre mark move with that offset.';
  OYPPrint.mountSettings(document.getElementById('printSet'));
  OYPPrint.mountQueue(document.getElementById('printQueue'));
}
window.onOypPrintSave = function () {
  var host = document.getElementById('prViews');
  if (host) host.innerHTML = '';
  draw();
};
if (window.OYPLabel && OYPLabel.ready && OYPLabel.ready.then) OYPLabel.ready.then(draw);
else draw();
})();
</script>
</body></html>
